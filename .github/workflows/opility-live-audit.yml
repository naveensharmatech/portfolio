name: Opility live API and Lighthouse audit
on:
  push:
    branches: [audit/portfolio-2026-11-07]
    paths: ['.github/api/opility.postman_collection.json','.github/workflows/opility-live-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p opility-live-results
      - run: npx --yes newman@6 run .github/api/opility.postman_collection.json --timeout-request 30000 --delay-request 300 --reporters cli,json --reporter-json-export opility-live-results/newman.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opility-live-api
          path: opility-live-results/
          retention-days: 14
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: mkdir -p opility-lighthouse-results
      - run: npx --yes lighthouse https://opility.com/ --output=json --output=html --output-path=opility-lighthouse-results/report --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --quiet
      - run: node .github/scripts/lighthouse-summary.mjs opility-lighthouse-results/report.report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opility-lighthouse
          path: opility-lighthouse-results/
          retention-days: 14
