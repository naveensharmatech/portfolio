name: Portfolio acceptance
on:
  pull_request:
  push:
    branches: [main, copilot/merge-mobile-responsiveness-accessibility]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run test:chat
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
