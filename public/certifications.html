<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Certifications · Naveen Sharma</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#172321;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px 20px}a{color:inherit;text-underline-offset:4px}h1{font-size:clamp(32px,5vw,48px);margin:28px 0 12px}p{color:#52615c;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}nav a{padding:12px 16px;background:white;border:1px solid #dce3d9;border-radius:12px}section{background:white;border:1px solid #dce3d9;border-radius:20px;padding:20px;margin:24px 0;scroll-margin-top:20px}h2{font-size:21px;margin:0 0 8px}iframe{display:block;width:100%;height:650px;border:1px solid #dce3d9;border-radius:12px;margin-top:18px}a:focus-visible{outline:3px solid #608b38;outline-offset:4px}@media(max-width:600px){iframe{height:460px}}
  </style>
</head>
<body><main>
  <a href="/#qualifications">← Back to qualifications</a>
  <h1 id="heading">Certifications</h1>
  <p id="description">Naveen Sharma’s completed qualifications, certificates and course badges.</p>
  <nav id="navigation" aria-label="Certificate documents"></nav>
  <div id="documents"></div>
</main>
<script>
  const groups = {
    qa: {title:'QA Manual & Automation', issuer:'Smart College · Great Learning Academy', documents:[['Quality Assurance Engineering — Web & Mobile','Quality Assurance Engineering (Web & Mobile).pdf'],['Introduction to Automation Testing','Automation Testing.pdf']]},
    jira: {title:'Jira Expertise', issuer:'Atlassian · JSM credential and two completed course badges', documents:[['JSM Fundamentals with AI','JSM Fundamentals with AI.pdf'],['Get started quickly with Jira Service Management','Naveen Sharma - Get started quickly with Jira Service Management Course.pdf'],['Manage customer requests in Jira Service Management','Naveen Sharma - Manage customer requests in Jira Service Management Course.pdf']]},
    testing: {title:'Automation Testing Certificate', issuer:'Great Learning Academy', documents:[['Introduction to Automation Testing','Automation Testing.pdf']]},
    ai: {title:'AI Tools Workshop Certificate', issuer:'be10x', documents:[['AI Tools and ChatGPT Workshop','Certificate AI Tools Workshop.pdf']]},
    crm: {title:'CRM Certificate', issuer:'HP LIFE · HP Foundation', documents:[['Customer Relationship Management','Customer Relationship Management  — CRM.pdf']]}
  };
  const selected = groups[new URLSearchParams(location.search).get('group')];
  const entries = selected ? [selected] : Object.values(groups);
  if(selected){document.title=selected.title+' · Naveen Sharma';document.getElementById('heading').textContent=selected.title;document.getElementById('description').textContent=selected.issuer;}
  let index=0;
  for(const group of entries)for(const [title,file] of group.documents){
    const id='certificate-'+(++index), url='/docs/'+encodeURIComponent(file);
    const section=document.createElement('section');section.id=id;
    const heading=document.createElement('h2');heading.textContent=title;
    const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noreferrer';link.textContent='Open PDF ↗';
    const frame=document.createElement('img');frame.src='/certificate-previews/'+encodeURIComponent(file.replace(/\.pdf$/,'.jpg'));frame.alt=title+' — Naveen Sharma';frame.loading='lazy';frame.style.cssText='display:block;width:100%;height:auto;margin-top:18px;border-radius:12px';
    section.append(heading,link,frame);document.getElementById('documents').append(section);
    const navLink=document.createElement('a');navLink.href='#'+id;navLink.textContent=title;document.getElementById('navigation').append(navLink);
  }
  document.getElementById('navigation').hidden=index<2;
</script>
</body></html>
